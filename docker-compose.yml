services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-badminton}
      POSTGRES_USER: ${POSTGRES_USER:-badminton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-badminton-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-badminton} -d ${POSTGRES_DB:-badminton}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      APP_ENV: demo
      APP_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-local-demo-jwt-secret-change-me-0123456789abcdef}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-badminton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-badminton-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-badminton}
      POSTGRES_SSLMODE: disable
      ALLOW_SQLITE_FALLBACK: "false"
      REDIS_ADDR: redis:6379
      REQUIRE_REDIS: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:${PUBLIC_PORT:-8080},http://127.0.0.1:${PUBLIC_PORT:-8080}
      DEMO_SEED_ENABLED: "true"
      DB_MAX_OPEN_CONNS: 40
      DB_MAX_IDLE_CONNS: 10
      DB_CONN_MAX_LIFETIME_MIN: 30
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 4s
      retries: 8
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
